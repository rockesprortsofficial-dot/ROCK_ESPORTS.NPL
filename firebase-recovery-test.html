<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROCK ESPORTS — Firebase connection test</title><style>body{font:16px system-ui;background:#101827;color:#eee;max-width:600px;margin:24px auto;padding:16px}label{display:block;margin-top:16px}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border-radius:8px}button{margin-top:10px}pre{white-space:pre-wrap}</style><h1>ROCK ESPORTS</h1><p>Isolated Firebase connection diagnostic. No tournament data is changed.</p><label>Firebase web configuration (JSON object only)<textarea id="config" rows="7" autocomplete="off"></textarea></label><button id="connect">Connect & test public read</button><label>Owner email<input id="email" type="email" autocomplete="username"></label><label>Owner password<input id="password" type="password" autocomplete="current-password"></label><button id="login" disabled>Sign in & test private read</button><button id="logout" disabled>Sign out</button><pre id="status" role="status"></pre><script type="module">
const el=id=>document.getElementById(id);
let api;
const show=t=>el("status").textContent=t;
el("connect").onclick=async()=>{try{const cfg=JSON.parse(el("config").value);if(cfg.projectId!=="rock-esports")throw Error("Wrong project");globalThis.ROCK_FIREBASE_CONFIG=cfg;api=await import("./rock-firebase-recovery.js");el("config").value="";el("connect").disabled=true;el("login").disabled=false;show(JSON.stringify(await api.checkPublicAccess(),null,2));}catch(e){show(e.message);}};
el("login").onclick=async()=>{try{if(!api)return;await api.login(el("email").value,el("password").value);el("logout").disabled=false;show("Owner sign-in succeeded. Private setup document: "+await api.checkPrivateAccess());}catch(e){show(e.message);}finally{el("password").value="";}};
el("logout").onclick=async()=>{await api.logout();el("logout").disabled=true;show("Signed out");};
</script></html>
