name: Integrate community feed into existing page
on:
  push:
    paths:
      - '.github/workflows/integrate-community-feed.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add-community-entrypoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Add only the community loader to the original page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          baseline = subprocess.check_output([
              "git", "show", "c1819c69c44a9b830caca99ba79e1091ad96297b:index.html"
          ])
          if b"rock-community-feed.js" in baseline:
              raise SystemExit("Community loader is already present in the baseline.")
          marker = b"</body>"
          point = baseline.lower().rfind(marker)
          if point < 0:
              raise SystemExit("Could not find the existing page ending.")
          injection = (
              b'\n<script src="./rock-community-feed.js" defer></script>\n'
              b'<script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("./service-worker.js", {scope:"./"}).catch(function(){}); }</script>\n'
          )
          Path("index.html").write_bytes(baseline[:point] + injection + baseline[point:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load community feed without changing existing page content"
          git push origin main
