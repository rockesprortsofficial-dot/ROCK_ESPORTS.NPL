name: Integrate community feed into existing page
on:
  push:
    paths:
      - '.github/workflows/integrate-community-feed.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add-community-entrypoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Add the community loader without rewriting existing content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path("index.html")
          text = page.read_text(encoding="utf-8")
          if "rock-community-feed.js" in text:
              raise SystemExit("Community loader is already present.")
          injection = (
              '\n<script src="./rock-community-feed.js" defer></script>\n'
              '<script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("./service-worker.js", {scope:"./"}).catch(function(){}); }</script>\n'
          )
          point = text.lower().rfind("</body>")
          if point < 0:
              raise SystemExit("Could not find the existing page ending.")
          text = text[:point] + injection + text[point:]
          page.write_text(text, encoding="utf-8", newline="")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load community feed on existing site"
          git push origin main
